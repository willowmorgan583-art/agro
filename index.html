    <script>
      // Suppress harmless Vite dev-server HMR / WebSocket transport failures in iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var file = (event && event.filename) || '';
        if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('transport') || file.includes('@vite/client')) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = String((event && event.reason && event.reason.message) || (event && event.reason) || '');
        if (reason.includes('WebSocket') || reason.includes('vite') || reason.includes('transport')) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);
    </script>
